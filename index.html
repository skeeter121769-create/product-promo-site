/* =========================================================
   Supabase 数据层（REST + Storage）
   ========================================================= */
async function cloudFetch(path, opts={}){
  const method=(opts.method||'GET').toUpperCase();
  // 写操作必须登录
  if(['POST','PATCH','DELETE','PUT'].includes(method) && !session){
    throw new Error('AUTH_REQUIRED');
  }
  const token = ['POST','PATCH','DELETE','PUT'].includes(method) ? session.access_token : SUPABASE_ANON_KEY;
  const url = SUPABASE_URL + path;
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 8000);
  try{
    const res = await fetch(url, {
      ...opts,
      signal: ctrl.signal,
      headers:{
        'apikey': SUPABASE_ANON_KEY,
        'Authorization':'Bearer '+token,
        'Content-Type':'application/json',
        ...(opts.headers||{})
      }
    });
    if(!res.ok){ const t=await res.text(); throw new Error('Supabase '+res.status+': '+t.slice(0,200)); }
    return res.status===204 ? null : res.json();
  } finally {
    clearTimeout(timer);
  }
}

    if(storageMode==='cloud'){
      const rows = await cloudFetch('/rest/v1/products?select=*&order=created_at.asc');
      return rows.map(r=>({id:r.id,storeId:r.store_id,name:r.name,sku:r.sku,images:r.images||[],highlights:r.highlights||[],specs:r.specs,commissionRate:r.commission_rate,commissionNote:r.commission_note,supplyPrice:r.supply_price,suggestedPrice:r.suggested_price,discount:r.discount,targetMarket:r.target_market,platform:r.platform,materialStatus:r.material_status,stockInfo:r.stock_info,salesData:r.sales_data,authorization:r.authorization_note,status:r.status,contactPerson:r.contact_person,contactInfo:r.contact_info,remark:r.remark}));
    }
    const d=lsLoad(); return d?d.products:[];
  },
  async addStore(s){ if(storageMode==='cloud'){ await cloudFetch('/rest/v1/stores',{method:'POST',body:JSON.stringify({name:s.name,platform:s.platform,target_market:s.targetMarket,store_url:s.storeUrl,category:s.category,rating:s.rating,remark:s.remark,created_at:new Date().toISOString()})}); return; } const d=lsLoad()||{stores:[],products:[]}; s.id='s'+Date.now(); d.stores.push(s); lsSave(d); },
  async updateStore(id,s){ if(storageMode==='cloud'){ await cloudFetch('/rest/v1/stores?id=eq.'+id,{method:'PATCH',body:JSON.stringify({name:s.name,platform:s.platform,target_market:s.targetMarket,store_url:s.storeUrl,category:s.category,rating:s.rating,remark:s.remark})}); return; } const d=lsLoad(); const i=d.stores.findIndex(x=>x.id===id); if(i>-1) d.stores[i]=s; lsSave(d); },
  async deleteStore(id){ if(storageMode==='cloud'){ await cloudFetch('/rest/v1/stores?id=eq.'+id,{method:'DELETE'}); return; } const d=lsLoad(); d.stores=d.stores.filter(x=>x.id!==id); d.products=d.products.filter(p=>p.storeId!==id); lsSave(d); },
  async addProduct(p){ if(storageMode==='cloud'){ await cloudFetch('/rest/v1/products',{method:'POST',body:JSON.stringify(toRow(p))}); return; } const d=lsLoad()||{stores:[],products:[]}; p.id='p'+Date.now(); d.products.push(p); lsSave(d); },
  async updateProduct(id,p){ if(storageMode==='cloud'){ await cloudFetch('/rest/v1/products?id=eq.'+id,{method:'PATCH',body:JSON.stringify(toRow(p))}); return; } const d=lsLoad(); const i=d.products.findIndex(x=>x.id===id); if(i>-1) d.products[i]=p; lsSave(d); },
  async deleteProduct(id){ if(storageMode==='cloud'){ await cloudFetch('/rest/v1/products?id=eq.'+id,{method:'DELETE'}); return; } const d=lsLoad(); d.products=d.products.filter(x=>x.id!==id); lsSave(d); },
  async uploadImage(file){
    if(storageMode==='cloud'){
      if(!session){ throw new Error('AUTH_REQUIRED'); }
      const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
      const path='img/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
      const form=new FormData(); form.append('file',file);
      const res=await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`,{
        method:'POST',headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+session.access_token},body:form
      });
      if(!res.ok){ const t=await res.text(); throw new Error('上传失败 '+res.status+': '+t.slice(0,150)); }
      return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`;
    }
    return await fileToDataUrl(file);
  },
  async seedIfEmpty(){
    const [stores,products]=await Promise.all([api.getStores(),api.getProducts()]);
    if(!stores.length && !products.length){
      for(const s of MOCK_STORES){ await api.addStore(s); }
      for(const p of MOCK_PRODUCTS){ await api.addProduct(p); }
    }
  }
};
function toRow(p){
  return {name:p.name,sku:p.sku,store_id:p.storeId,images:p.images||[],highlights:p.highlights||[],specs:p.specs,commission_rate:p.commissionRate,commission_note:p.commissionNote,supply_price:p.supplyPrice,suggested_price:p.suggestedPrice,discount:p.discount,target_market:p.targetMarket,platform:p.platform,material_status:p.materialStatus,stock_info:p.stockInfo,sales_data:p.salesData,authorization_note:p.authorization,status:p.status,contact_person:p.contactPerson,contact_info:p.contactInfo,remark:p.remark,created_at:new Date().toISOString()};
}
function fileToDataUrl(file){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});
}

/* =========================================================
   App 状态
   ========================================================= */
let state={stores:[],products:[],route:location.hash||'#/',ready:false};
let listeners=[];

async function loadAll(){
  try{
    const ok = await api.check();
    updateStoragePill();
    if(ok){
      try{ await api.seedIfEmpty(); }catch(e){ console.warn('seed fail',e); }
    }
    const [stores,products]=await Promise.all([api.getStores(),api.getProducts()]);
    state.stores=stores; state.products=products;
    // 云端数据为空且访客无法写：用本地示例数据兜底展示，避免白屏
    if(storageMode==='cloud' && !state.stores.length && !state.products.length){
      state.stores=MOCK_STORES; state.products=MOCK_PRODUCTS;
    }
  }catch(e){
    // 任何失败：降级到本地
    storageMode='local'; updateStoragePill();
    const [stores,products]=await Promise.all([api.getStores(),api.getProducts()]);
    if(!stores.length&&!products.length){ lsSave({stores:MOCK_STORES,products:MOCK_PRODUCTS}); state.stores=MOCK_STORES; state.products=MOCK_PRODUCTS; }
    else { state.stores=stores; state.products=products; }
  }
  state.ready=true;
  render();
}
window.__recheckCloud=async()=>{ toast('正在重新连接云端…'); storageMode='cloud'; await loadAll(); if(storageMode==='cloud') toast('已连接云端 ✓'); };
function updateStoragePill(){
  const pill=document.getElementById('storagePill');
  const banner=document.getElementById('localBanner');
  if(storageMode==='cloud'){ pill.textContent='✓ 云端同步'; pill.className='storage-pill pill-cloud'; banner.classList.add('hidden'); }
  else if(storageMode==='local'){ pill.textContent='本地模式'; pill.className='storage-pill pill-local'; banner.classList.remove('hidden'); }
  else { pill.textContent='检测中…'; pill.className='storage-pill pill-checking'; }
}

function setRoute(r){ location.hash=r; }
window.addEventListener('hashchange', ()=>{ state.route=location.hash||'#/'; updateNav(); render(); });
function updateNav(){
  const path=state.route.split('?')[0];
  document.querySelectorAll('#nav a').forEach(a=>{
    const r=a.dataset.route;
    a.classList.toggle('active', (r==='products'&&path==='#/')||path.startsWith(a.getAttribute('href')));
  });
}

/* =========================================================
   Helpers
   ========================================================= */
function storeById(id){ return state.stores.find(s=>s.id===id)||{}; }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return '$'+ (Number(n)||0).toFixed(2); }
function statusBadge(s){
  if(s==='active') return '<span class="badge badge-active">在售</span>';
  if(s==='pending') return '<span class="badge badge-pending">待上架</span>';
  return '<span class="badge badge-offline">已下架</span>';
}
let toastTimer;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }

function openModal(html){
  document.getElementById('modalRoot').innerHTML=`<div class="modal-mask" onclick="if(event.target===this)closeModal()">${html}</div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

/* =========================================================
   Views
   ========================================================= */
function render(){
  const app=document.getElementById('app');
  if(!state.ready){ app.innerHTML='<div class="loading"><div class="spinner"></div>加载中…</div>'; return; }
  const path=state.route.split('?')[0];
  if(path.startsWith('#/stores/')){ app.innerHTML=storeDetailView(path.split('/')[2]); }
  else if(path==='#/stores'){ app.innerHTML=storeListView(); }
  else if(path.startsWith('#/product/')){ app.innerHTML=productDetailView(path.split('/')[2]); }
  else if(path==='#/admin'){ app.innerHTML=adminView(); }
  else { app.innerHTML=productListView(); }
  bindListEvents();
}

      <div class="atab ${adminTab==='stores'?'active':''}" onclick="adminTab='stores';render()">店铺管理</div>
    </div>
    ${adminTab==='products'?adminProductsTable():adminStoresTable()}
  </div>`;
}
function adminProductsTable(){
  const sMap=Object.fromEntries(state.stores.map(s=>[s.id,s.name]));
  const rows=state.products.map(p=>`<tr>
    <td>${p.images&&p.images[0]?`<img class="thumb" src="${esc(p.images[0])}">`:'<div class="thumb" style="display:flex;align-items:center;justify-content:center;color:#c0c4cc">无</div>'}</td>
    <td><b>${esc(p.name)}</b><br><span class="muted small">${esc(p.sku||'')}</span></td>
    <td><span class="store-tag">${esc(sMap[p.storeId]||'未分类')}</span></td>
    <td style="color:var(--primary);font-weight:700">${p.commissionRate||0}%</td>
    <td>
      <select onchange="quickStatus('${p.id}',this.value)">
        <option value="pending" ${p.status==='pending'?'selected':''}>待上架</option>
        <option value="active" ${p.status==='active'?'selected':''}>在售</option>
        <option value="offline" ${p.status==='offline'?'selected':''}>已下架</option>
      </select>
    </td>
    <td>
      <div class="row-actions">
        <button class="btn btn-ghost btn-sm" onclick="productForm('${p.id}')">编辑</button>
        <button class="btn btn-danger btn-sm" onclick="deleteProduct('${p.id}')">删除</button>
      </div>
    </td>
  </tr>`).join('');
  return `<table class="atable">
    <thead><tr><th></th><th>商品</th><th>所属店铺</th><th>佣金</th><th>状态</th><th>操作</th></tr></thead>
    <tbody>${rows||'<tr><td colspan=6 style="text-align:center;color:var(--muted);padding:30px">暂无商品，点击右上角新增</td></tr>'}</tbody>
  </table>`;
}
function adminStoresTable(){
  const counts={}; state.products.forEach(p=>counts[p.storeId]=(counts[p.storeId]||0)+1);
  const rows=state.stores.map(s=>`<tr>
    <td><b>${esc(s.name)}</b></td>
    <td><span class="store-tag">${esc(s.platform)}</span> <span class="store-tag">${esc(s.targetMarket)}</span></td>
    <td>${esc(s.category||'')}</td>
    <td>${counts[s.id]||0} 个</td>
    <td>
      <div class="row-actions">
        <button class="btn btn-ghost btn-sm" onclick="storeForm('${s.id}')">编辑</button>
        <button class="btn btn-danger btn-sm" onclick="deleteStore('${s.id}')">删除</button>
      </div>
    </td>
  </tr>`).join('');
  return `<table class="atable">
    <thead><tr><th>店铺</th><th>平台 / 市场</th><th>品类</th><th>商品数</th><th>操作</th></tr></thead>
    <tbody>${rows||'<tr><td colspan=5 style="text-align:center;color:var(--muted);padding:30px">暂无店铺</td></tr>'}</tbody>
  </table>`;
}

/* =========================================================
   Forms
   ========================================================= */
function storeForm(id){
  const s=id?state.stores.find(x=>x.id===id):{name:'',platform:'',targetMarket:'',storeUrl:'',category:'',rating:'',remark:''};
  openModal(`
    <div class="modal"><h3>${id?'编辑店铺':'新增店铺'}</h3>
      <div class="form-grid">
        <div class="form-field full"><label>店铺名称 *</label><input id="f-name" value="${esc(s.name)}"></div>
        <div class="form-field"><label>销售平台</label><input id="f-platform" value="${esc(s.platform)}" placeholder="Shopify / TikTok Shop / Amazon"></div>
        <div class="form-field"><label>目标市场</label><input id="f-market" value="${esc(s.targetMarket)}" placeholder="美区 / 英区"></div>
        <div class="form-field"><label>主打品类</label><input id="f-category" value="${esc(s.category)}"></div>
        <div class="form-field"><label>评分 / 粉丝</label><input id="f-rating" value="${esc(s.rating)}"></div>
        <div class="form-field full"><label>店铺链接</label><input id="f-url" value="${esc(s.storeUrl)}" placeholder="https://..."></div>
        <div class="form-field full"><label>店铺定位 / 备注</label><textarea id="f-remark">${esc(s.remark)}</textarea></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="saveStore('${id||''}')">保存</button>
      </div>
    </div>`);
}
async function saveStore(id){
  if(!requireLogin()) return;
  const val={name:val('f-name'),platform:val('f-platform'),targetMarket:val('f-market'),storeUrl:val('f-url'),category:val('f-category'),rating:val('f-rating'),remark:val('f-remark')};
  if(!val.name){toast('请填写店铺名称');return;}
  try{
    if(id){ await api.updateStore(id,{...val,id}); } else { await api.addStore(val); }
    closeModal(); await loadAll(); toast(id?'已保存':'已新增店铺');
  }catch(e){ toast('保存失败：'+e.message); }
}

function productForm(id){
  const p=id?state.products.find(x=>x.id===id):{name:'',sku:'',storeId:state.stores[0]?.id||'',images:[],highlights:[''],specs:'',commissionRate:20,commissionNote:'',supplyPrice:'',suggestedPrice:'',discount:'',targetMarket:'',platform:'',materialStatus:'',stockInfo:'',salesData:'',authorization:'',status:'pending',contactPerson:'',contactInfo:'',remark:''};
  const storeOpts=state.stores.map(s=>`<option value="${s.id}" ${p.storeId===s.id?'selected':''}>${esc(s.name)}</option>`).join('');
  const hlInputs=(p.highlights&&p.highlights.length?p.highlights:['']).map((h,i)=>`<div style="display:flex;gap:8px;margin-bottom:6px"><input value="${esc(h)}" data-hl="${i}" placeholder="卖点 ${i+1}"><button class="btn btn-danger btn-sm" onclick="event.preventDefault();removeHl(this)">×</button></div>`).join('');
  const imgPreview=p.images.map((u,i)=>`<div class="img-preview"><img src="${esc(u)}"><button class="del" onclick="removeImg(${i})">×</button></div>`).join('');
  openModal(`
    <div class="modal" style="max-width:820px"><h3>${id?'编辑商品':'新增商品'}</h3>
      <div class="form-grid">
        <div class="form-field full"><label>商品名称 *</label><input id="p-name" value="${esc(p.name)}"></div>
        <div class="form-field"><label>货号 / SKU</label><input id="p-sku" value="${esc(p.sku)}"></div>
        <div class="form-field"><label>所属店铺 *</label><select id="p-store"><option value="">未选择</option>${storeOpts}</select></div>

        <div class="form-field full"><label>产品图片</label>
          <div class="img-uploader" onclick="document.getElementById('p-imgfile').click()">点击上传图片（可多张，上传到云端）</div>
          <input type="file" id="p-imgfile" accept="image/*" multiple class="hidden" onchange="uploadImgs(this)">
          <div class="img-preview-list" id="imgPreview">${imgPreview}</div>
        </div>

        <div class="form-field full"><label>产品卖点</label><div id="hlList">${hlInputs}</div>
          <button class="btn btn-ghost btn-sm" onclick="event.preventDefault();addHl()">+ 添加卖点</button>
        </div>

        <div class="form-field"><label>佣金率 (%) *</label><input id="p-comm" type="number" value="${p.commissionRate}" min="0" max="100"></div>
        <div class="form-field"><label>结算说明</label><input id="p-commnote" value="${esc(p.commissionNote)}"></div>
        <div class="form-field"><label>供货价 ($)</label><input id="p-supply" type="number" step="0.01" value="${p.supplyPrice}"></div>
        <div class="form-field"><label>建议售价 ($)</label><input id="p-price" type="number" step="0.01" value="${p.suggestedPrice}"></div>
        <div class="form-field"><label>活动 / 折扣</label><input id="p-discount" value="${esc(p.discount)}"></div>
        <div class="form-field"><label>状态</label><select id="p-status"><option value="pending" ${p.status==='pending'?'selected':''}>待上架</option><option value="active" ${p.status==='active'?'selected':''}>在售</option><option value="offline" ${p.status==='offline'?'selected':''}>已下架</option></select></div>
        <div class="form-field"><label>目标市场</label><input id="p-market" value="${esc(p.targetMarket)}"></div>
        <div class="form-field"><label>销售平台</label><input id="p-platform" value="${esc(p.platform)}"></div>
        <div class="form-field"><label>素材情况</label><input id="p-material" value="${esc(p.materialStatus)}"></div>
        <div class="form-field"><label>库存 / 可支持单量</label><input id="p-stock" value="${esc(p.stockInfo)}"></div>
        <div class="form-field"><label>销量表现</label><input id="p-sales" value="${esc(p.salesData)}"></div>
        <div class="form-field"><label>授权说明</label><input id="p-auth" value="${esc(p.authorization)}"></div>
        <div class="form-field"><label>对接人</label><input id="p-person" value="${esc(p.contactPerson)}"></div>
        <div class="form-field"><label>联系方式</label><input id="p-contact" value="${esc(p.contactInfo)}"></div>
        <div class="form-field full"><label>规格参数</label><textarea id="p-specs">${esc(p.specs)}</textarea></div>
        <div class="form-field full"><label>备注</label><textarea id="p-remark">${esc(p.remark)}</textarea></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="saveProduct('${id||''}')">保存</button>
      </div>
    </div>`);
}
function val(id){ return document.getElementById(id)?.value||''; }

let draftImages=[];
function uploadImgs(input){
  const files=[...input.files];
  (async()=>{
    for(const f of files){
      try{ const url=await api.uploadImage(f); draftImages.push(url); }
      catch(e){ toast('图片上传失败：'+e.message); }
    }
    input.value='';
    const wrap=document.getElementById('imgPreview');
    if(wrap) wrap.innerHTML = draftImages.map((u,i)=>`<div class="img-preview"><img src="${esc(u)}"><button class="del" onclick="removeImg(${i})">×</button></div>`).join('');
  })();
}
function removeImg(i){ draftImages.splice(i,1); const wrap=document.getElementById('imgPreview'); if(wrap) wrap.innerHTML=draftImages.map((u,idx)=>`<div class="img-preview"><img src="${esc(u)}"><button class="del" onclick="removeImg(${idx})">×</button></div>`).join(''); }
function addHl(){
  const list=document.getElementById('hlList');
  const i=list.children.length;
  const d=document.createElement('div'); d.style.display='flex'; d.style.gap='8px'; d.style.marginBottom='6px';
  d.innerHTML=`<input data-hl="${i}" placeholder="卖点 ${i+1}"><button class="btn btn-danger btn-sm" onclick="event.preventDefault();removeHl(this)">×</button>`;
  list.appendChild(d);
}
function removeHl(btn){ btn.parentElement.remove(); }
function collectHl(){ return [...document.querySelectorAll('[data-hl]')].map(i=>i.value).filter(v=>v.trim()); }

async function saveProduct(id){
  if(!requireLogin()) return;
  const prev=id?state.products.find(x=>x.id===id):null;
  const existingImgs=prev?prev.images:[];
  const allImgs=[...existingImgs,...draftImages];
  const val2={
    name:val('p-name'),sku:val('p-sku'),storeId:val('p-store'),images:allImgs,highlights:collectHl(),
    specs:val('p-specs'),commissionRate:Number(val('p-comm'))||0,commissionNote:val('p-commnote'),
    supplyPrice:Number(val('p-supply'))||0,suggestedPrice:Number(val('p-price'))||0,discount:val('p-discount'),
    targetMarket:val('p-market'),platform:val('p-platform'),materialStatus:val('p-material'),
    stockInfo:val('p-stock'),salesData:val('p-sales'),authorization:val('p-auth'),
    status:val('p-status'),contactPerson:val('p-person'),contactInfo:val('p-contact'),remark:val('p-remark')
  };
  if(!val2.name){toast('请填写商品名称');return;}
  if(!val2.storeId){toast('请选择所属店铺');return;}
  try{
    if(id){ await api.updateProduct(id,val2); } else { await api.addProduct(val2); }
    draftImages=[];
    closeModal(); await loadAll(); toast(id?'已保存':'已新增商品');
  }catch(e){ toast('保存失败：'+e.message); }
}

async function quickStatus(id,status){
  if(!requireLogin()) return;
  const p=state.products.find(x=>x.id===id); if(!p)return;
  p.status=status;
  try{ await api.updateProduct(id,p); toast('状态已更新'); }
  catch(e){ toast('更新失败：'+e.message); }
}
async function deleteProduct(id){
  if(!requireLogin()) return;
  if(!confirm('确定删除该商品？'))return;
  try{ await api.deleteProduct(id); await loadAll(); toast('已删除'); }catch(e){ toast('删除失败：'+e.message); }
}
async function deleteStore(id){
  if(!requireLogin()) return;
  const n=state.products.filter(p=>p.storeId===id).length;
  if(!confirm(`确定删除该店铺？其下 ${n} 个商品也会一并删除。`))return;
  try{ await api.deleteStore(id); await loadAll(); toast('已删除店铺'); }catch(e){ toast('删除失败：'+e.message); }
}
function adminExport(){
  if(!requireLogin()) return;
  const blob=new Blob([JSON.stringify({stores:state.stores,products:state.products},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='推品数据备份.json'; a.click();
  toast('已导出数据');
}

/* =========================================================
   List bindings
   ========================================================= */
function bindListEvents(){
  const si=document.getElementById('searchInput');
  if(si){
    let t;
    si.addEventListener('input',()=>{ clearTimeout(t); t=setTimeout(()=>updateParam('kw',si.value),300); });
  }
  document.querySelectorAll('[data-filter]').forEach(el=>{
    el.addEventListener('change',()=>updateParam(el.dataset.filter,el.dataset.val));
  });
  const clear=document.getElementById('clearBtn');
  if(clear) clear.addEventListener('click',()=>{ location.hash='#/'; });
}
function updateParam(key,val){
  const path=state.route.split('?')[0]||'#/';
  const params=new URLSearchParams(state.route.split('?')[1]||'');
  if(!val||val==='all') params.delete(key); else params.set(key,val);
  const qs=params.toString();
  history.replaceState(null,'',path+(qs?'?'+qs:''));
  state.route=path+(qs?'?'+qs:'');
  render();
}

/* =========================================================
   登录 / 鉴权
   ========================================================= */
function updateLoginBtn(){
  const btn=document.getElementById('loginBtn');
  if(!btn) return;
  if(session){
    btn.textContent='退出登录';
    btn.classList.remove('btn-ghost');
    btn.classList.add('btn-danger');
  } else {
    btn.textContent='登录管理';
    btn.classList.add('btn-ghost');
    btn.classList.remove('btn-danger');
  }
}
function toggleLogin(){
  if(session){ doLogout(); return; }
  if(state.route!=='#/admin'){ location.hash='#/admin'; }
  else render();
}
async function doLogin(){
  const email=document.getElementById('loginEmail')?.value.trim();
  const pass=document.getElementById('loginPassword')?.value;
  if(!email||!pass){ toast('请输入邮箱和密码'); return; }
  try{
    const { data, error } = await sbClient.auth.signInWithPassword({ email, password: pass });
    if(error) throw error;
    session=data.session;
    updateLoginBtn();
    toast('登录成功 ✓');
    await loadAll();
    if(state.route!=='#/admin') location.hash='#/admin';
    render();
  }catch(e){
    toast('登录失败：'+(e.message||'邮箱或密码错误'));
  }
}
async function doLogout(){
  await sbClient.auth.signOut();
  session=null;
  updateLoginBtn();
  toast('已退出登录');
  location.hash='#/';
}
function requireLogin(){
  if(session) return true;
  toast('请先登录管理后台');
  location.hash='#/admin';
  render();
  return false;
}

/* init */
(async function(){
  try{ await initAuth(); }catch(e){ console.warn('auth init',e); }
  await loadAll();
})();
</script>
</body>
</html>
